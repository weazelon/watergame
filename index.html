<!DOCTYPE html>
<html lang="en" style="background:#E9E6F2">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Cup Sort</title>
<style>
  :root{
    --bg:#E9E6F2;
    --line:#33323F;
    --text:#33323F;
    --dim:#8D8CA6;
    --card:#FFFFFF;
    --locked:#F1EEF7;
    --hard:#33323F;
    --uiline:#33323F;
    --lockink:rgba(51,50,63,.45);
    --inset:rgba(51,50,63,.08);
    --ground:rgba(76,70,105,.16);
    --accent:#5B4FD6;
    --tw:64px;   /* tube width  */
    --th:164px;  /* tube height */
    --seg:34px;  /* liquid layer height */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; height:100dvh; background:var(--bg); overflow:hidden; overscroll-behavior:none;}
  .tube::before{
    transition:opacity .25s ease;
    content:''; position:absolute; z-index:0;
    left:13%; right:13%; bottom:-5px; height:10px; border-radius:50%;
    background:radial-gradient(ellipse at center, var(--ground), transparent 70%);
    pointer-events:none;
  }
  body.dark{
    --bg:#3C3850;
    --card:#4D4962;
    --text:#EBE8F3;
    --dim:#A6A1BC;
    --locked:#433F59;
    --hard:#161320;
    --uiline:#7B7594;
    --lockink:rgba(235,232,243,.48);
    --inset:rgba(0,0,0,.25);
    --ground:rgba(0,0,0,.32);
  }
  body{
    margin:0;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    color:var(--text);
    display:flex; flex-direction:column; align-items:center;
    min-height:100dvh; overflow:hidden;
  }
  header{
    width:100%; max-width:820px;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 4px;
  }
  .lvl-badge{
    cursor:pointer; color:var(--text);
    background:var(--card); border:3px solid var(--uiline);
    padding:8px 18px; border-radius:999px; font-size:16px; font-weight:800;
    letter-spacing:.4px; font-family:inherit;
    box-shadow:0 3px 0 var(--hard);
  }
  .lvl-badge small{color:var(--dim); font-weight:700; margin-right:6px;}
  .lvl-badge:active{transform:translateY(2px); box-shadow:0 1px 0 var(--hard);}
  .hud{display:flex; gap:10px;}
  .hud button{
    width:46px; height:46px; border-radius:16px; border:3px solid var(--uiline);
    background:var(--card); color:var(--text); font-size:20px; font-weight:800; cursor:pointer;
    display:grid; place-items:center; box-shadow:0 3px 0 var(--hard);
    transition:transform .08s, box-shadow .08s;
  }
  .hud button:active{transform:translateY(2px); box-shadow:0 1px 0 var(--hard);}
  .hud button svg{width:22px; height:22px; display:block;}
  .hud button:disabled{opacity:.35; cursor:default;}
  .hud button:focus-visible, .lvl-badge:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  #moves{color:var(--dim); font-size:13px; font-weight:800; text-align:center; margin:2px 0 16px; height:18px; line-height:18px; overflow:visible; letter-spacing:.5px;}

  #board{
    flex:1; width:100%;
    position:relative;
    overflow:visible;
  }
  #thumbUndo{
    position:fixed; right:16px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    width:60px; height:60px; border-radius:50%; z-index:40;
    border:3px solid var(--uiline); background:var(--card); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 0 var(--hard);
    transition:transform .08s, box-shadow .08s, opacity .15s;
  }
  #thumbUndo svg{width:26px; height:26px;}
  #thumbUndo:active{transform:translateY(3px); box-shadow:0 1px 0 var(--hard);}
  #thumbUndo:disabled{opacity:.35; cursor:default;}
  #board{padding-bottom:88px;}
  #boardInner{
    display:grid;
    column-gap:16px; row-gap:48px;
    /* transform-only centering: immune to size. margin:auto and grid
       place-items both fail to center boxes larger than their container
       (over-constrained absolutes resolve margin-left:0 and left-anchor).
       left/top pin the anchor; translate(-50%,-50%) centers the box on it
       regardless of size; the -42px lifts it clear of the thumb-undo strip. */
    position:absolute; left:50%; top:50%;
    width:max-content; height:max-content;
    transform:translate(-50%, calc(-50% - 42px));
    transform-origin:center center;
  }
  .slot{position:relative; width:var(--tw); height:calc(var(--th) + 30px);}

  .tube{
    width:var(--tw); height:var(--th);
    position:relative;
    cursor:pointer;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  .tube.sel{ transform:translateY(-16px);}
  .tube.reject{ animation:shake .3s ease;}
  .tube.pouring{ transition:none; z-index:40; }
  @keyframes shake{ 25%{transform:translateX(-5px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-3px)} }

  .tube svg{position:absolute; inset:0; width:100%; height:100%;}
  .tube svg.top{pointer-events:none; z-index:2;}
  .cupart{position:absolute; inset:0;}
  .liquid{
    position:absolute; inset:0; z-index:1;
    clip-path:path('M12 18 L15.5 144 Q16 154 26 154 L38 154 Q48 154 48.5 144 L52 18 Z');
    padding-bottom:10px;
  }
  /* the wobble transform lives on this inner box; the mask stays on .liquid,
     pinned to the cup, so sloshing liquid is clipped at the glass */
  .liqInner{height:100%; display:flex; flex-direction:column-reverse;}
  .seg{
    width:100%; height:var(--seg);
    flex:0 0 auto; position:relative;
    transition:height .19s cubic-bezier(.4,0,.2,1);
    border-radius:0 0 50% 50% / 0 0 5px 5px;
  }
  .liquid .seg:first-child{border-radius:0;}
  .seg::after{
    content:''; position:absolute; z-index:-1;
    left:0; right:0; top:0; bottom:-34px;
    background:inherit; background-image:none; border-radius:0;
    pointer-events:none;
  }
  .seg.drained::after{display:none;}
  .tube.pouring .seg{border-radius:0;}
  .liquid.inflight .seg{visibility:hidden;}
  .flightliq{
    position:absolute; left:0; right:0;
    transition:height .19s cubic-bezier(.4,0,.2,1),
               background-position .19s cubic-bezier(.4,0,.2,1),
               opacity .12s ease;
    background-repeat:no-repeat;
  }
  .flightliq::before{
    content:''; position:absolute; left:0; right:0; top:-6px; height:12px;
    border-radius:50%; background:var(--top); filter:brightness(1.12);
    pointer-events:none;
  }
  .tube.sel::before{opacity:.45;}
  .tube.pouring::before{opacity:0;}
  .seg.drained{margin-top:0;}
  .seg::before{
    content:''; position:absolute; left:0; right:0; top:-6px; height:12px;
    border-radius:50%;
    background:inherit; filter:brightness(1.12); pointer-events:none;
    display:none;
  }
  .seg.topsurf::before{display:block;}
  .seg.pour-in{height:0;}
  .seg.mask{background:#C7C1D9 url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2240%22%20height=%2240%22%3E%3Ctext%20x=%2220%22%20y=%2229%22%20font-size=%2225%22%20font-weight=%22800%22%20fill=%22%236E6890%22%20text-anchor=%22middle%22%20font-family=%22Arial,%20Helvetica,%20sans-serif%22%3E?%3C/text%3E%3C/svg%3E") center/20px no-repeat;}

  .lid{
    position:absolute; top:-5px; left:-3px; width:calc(100% + 6px); height:26px;
    z-index:3; pointer-events:none;
  }
  .lid svg{position:static; width:100%; height:100%; display:block;}

  .stream{
    position:fixed; z-index:35; pointer-events:none;
  }
  .splash{
    position:absolute; width:7px; height:7px; border-radius:50%;
    z-index:36; pointer-events:none;
    border:1.5px solid rgba(51,50,63,.35);
  }
  .ripple{
    position:absolute; width:26px; height:12px;
    border:2.5px solid; border-radius:50%;
    z-index:36; pointer-events:none;
    background:transparent;
  }
  .spark{
    position:fixed; z-index:45; pointer-events:none;
    font-size:16px; line-height:1;
    text-shadow:0 0 2px #fff;
  }
  .fizz-cover{
    position:absolute; left:0; right:0; bottom:0; top:-7px; z-index:2; pointer-events:none;
    background:radial-gradient(120% 100% at 50% 40%, #E2DEEF 30%, #D5CFE4 68%, #CBC5DB 100%);
  }
  .bubble{
    position:absolute; border-radius:50%;
    z-index:3; pointer-events:none;
    background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 18%, rgba(255,255,255,.35) 45%, rgba(255,255,255,.05) 70%);
    border:1.5px solid rgba(163,157,188,.55);
  }
  .bubble.free{position:fixed; z-index:38;}
  .confetti{position:fixed; width:9px; height:9px; border-radius:3px; border:2px solid var(--uiline); z-index:44; pointer-events:none;}
  .fw-dot{position:fixed; width:8px; height:8px; border-radius:50%; z-index:55; pointer-events:none;}
  .fw-flash{position:fixed; width:120px; height:120px; border-radius:50%; border:4px solid; z-index:54; pointer-events:none;}

  #deadend{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    display:none; z-index:18;
    background:var(--card); border:3px solid var(--uiline); border-radius:20px;
    box-shadow:0 5px 0 var(--hard);
    padding:18px 22px; text-align:center;
  }
  #deadend.show{display:block; animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
  #deadend p{margin:0 0 12px; font-weight:800; color:var(--dim); letter-spacing:.6px;}

  .faucet{
    position:absolute; bottom:-34px; left:50%; transform:translateX(-50%);
    width:46px; height:44px; border:none; background:none; padding:0;
    cursor:pointer; z-index:4;
    transition:transform .1s;
  }
  .faucet:active{transform:translateX(-50%) scale(1.18);}
  .faucet.open{transform:translateX(-50%) scale(1.28); transition:transform .1s;}
  .faucet:focus-visible{outline:3px solid var(--accent); border-radius:8px;}
  .faucet svg{display:block; width:100%; height:100%;}

  /* overlay */
  #overlay{
    position:fixed; inset:0; display:none; place-items:center;
    background:rgba(51,50,63,.45); backdrop-filter:blur(4px); z-index:60;
  }
  #overlay.show{display:grid;}
  .panel{
    background:var(--card); border:3px solid var(--uiline);
    border-radius:24px; padding:28px 32px; text-align:center; max-width:320px;
    box-shadow:0 6px 0 var(--hard);
    animation:pop .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{from{transform:scale(.7); opacity:0}}
  .panel.win{max-width:340px; padding:26px 30px 24px; border-width:3.5px; border-color:var(--uiline); box-shadow:0 8px 0 var(--hard);}
  .win-title{letter-spacing:2px; font-size:24px; margin:0 0 4px;}
  .stars{display:flex; align-items:center; justify-content:center; gap:8px; height:72px; margin:2px 0 8px;}
  .win-lvl{font-weight:800; letter-spacing:.14em; color:var(--dim); font-size:14px; margin-top:-2px;}
  @media (hover:hover) and (pointer:fine){ #thumbUndo{display:none;} }
  #ver{
    position:fixed; right:6px; bottom:3px; z-index:30;
    font-size:10px; font-weight:700; letter-spacing:.06em;
    color:var(--dim); opacity:.55; pointer-events:none; user-select:none;
  }
  .star{opacity:0; transform:scale(0);}
  .star.on{animation:starpop .5s cubic-bezier(.34,1.66,.5,1) forwards;}
  .star.off{animation:starfade .35s ease-out forwards;}
  @keyframes starpop{0%{opacity:1; transform:scale(0) rotate(-28deg)} 62%{opacity:1; transform:scale(1.28) rotate(7deg)} 100%{opacity:1; transform:scale(1) rotate(0)}}
  @keyframes starfade{to{opacity:1; transform:scale(1)}}
  .btn{white-space:nowrap;}
  .panel.select{max-width:540px; width:min(94vw,540px); padding:20px 20px 18px; text-align:left; box-sizing:border-box;}
  .sel-head{display:flex; align-items:center; gap:10px; margin:0 4px 12px;}
  .sel-head h2{margin:0; font-size:22px; flex:1;}
  .sel-head input{
    width:86px; border:3px solid var(--uiline); border-radius:12px; padding:8px 10px;
    font:inherit; font-weight:800; text-align:center; background:var(--card); color:var(--text);
    -moz-appearance:textfield; appearance:textfield; outline:none;
  }
  .sel-head input::-webkit-outer-spin-button,.sel-head input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .sel-head input:focus{border-color:var(--text); box-shadow:none;}
  .sel-close{width:44px; height:44px;}
  .sel-close svg{width:18px; height:18px;}
  .sel-nav{display:flex; align-items:center; gap:10px; margin:0 0 12px;}
  .btn-icon.nav{width:44px; height:44px;}
  .btn-icon.nav svg{width:18px; height:18px;}
  .btn-icon.nav:disabled{opacity:.3; cursor:default;}
  .chap-label{flex:1; text-align:center; font-weight:900; letter-spacing:1.2px; font-size:14px; color:var(--text);}
  .sel-head input::placeholder{color:var(--text); opacity:.75;}
  .lvgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; padding:2px; touch-action:pan-y;}
  .lvgrid.slide-l{animation:slideL .22s ease-out;}
  .lvgrid.slide-r{animation:slideR .22s ease-out;}
  @keyframes slideL{from{transform:translateX(26px); opacity:.4}}
  @keyframes slideR{from{transform:translateX(-26px); opacity:.4}}
  .lv{
    position:relative; border:3px solid var(--uiline); border-radius:16px; background:var(--card);
    box-shadow:0 3px 0 var(--hard); cursor:pointer; padding:11px 0 8px; text-align:center;
    font-weight:900; font-size:20px; color:var(--text); font-family:inherit;
    transition:transform .07s, box-shadow .07s;
  }
  .lv .st svg{width:14px; height:14px;}
  .lv:active{transform:translateY(2px); box-shadow:0 1px 0 var(--hard);}
  .lv.cur{background:#5FE0AC; color:#17352A; border-color:var(--text); box-shadow:0 3px 0 var(--hard);}
  .lv.locked{background:var(--locked); color:var(--lockink); box-shadow:0 3px 0 var(--lockink); border-color:var(--lockink); cursor:not-allowed;}
  .lv.locked:active{transform:none; box-shadow:0 3px 0 var(--lockink);}
  .lv.deny{animation:deny .3s ease;}
  @keyframes deny{25%{transform:translateX(-3px)} 50%{transform:translateX(3px)} 75%{transform:translateX(-2px)}}
  .lv .st{display:flex; gap:1px; justify-content:center; margin-top:2px; height:12px;}
  .lv .mech{
    position:absolute; top:-9px; right:-7px; width:22px; height:22px; border-radius:50%;
    background:var(--card); border:2.5px solid var(--uiline);
    display:flex; align-items:center; justify-content:center;
  }
  .lv .mech svg{width:12px; height:12px;}
  .win-row{align-items:stretch;}
  .btn.primary{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:9px;
    font-size:17px; letter-spacing:.4px; padding:15px 24px;
  }
  .btn.primary .arrow{width:20px; height:20px; flex:0 0 auto;}
  .btn-icon{
    width:58px; height:58px; flex:0 0 auto; border-radius:50%;
    border:3px solid var(--uiline); background:var(--card); color:var(--text);
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    box-shadow:inset 0 -3px 0 var(--inset), 0 4px 0 var(--hard);
    transition:transform .08s, box-shadow .08s;
  }
  .btn-icon svg{width:24px; height:24px;}
  .btn-icon:active{transform:translateY(3px); box-shadow:inset 0 -2px 0 var(--inset), 0 1px 0 var(--hard);}
  .panel h2{margin:0 0 6px; font-size:26px;}
  .panel p{margin:0 0 18px; color:var(--dim); font-weight:700;}
  .panel .row, #deadend .row{display:flex; gap:10px; justify-content:center;}
  .btn{
    border:3px solid var(--uiline); border-radius:999px; padding:13px 22px;
    font-size:16px; font-weight:800; font-family:inherit; cursor:pointer;
    color:#17352A; background:#5FE0AC;
    box-shadow:inset 0 -4px 0 rgba(23,110,79,.22), 0 4px 0 var(--hard);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(3px); box-shadow:inset 0 -2px 0 rgba(23,110,79,.22), 0 1px 0 var(--hard);}
  .btn.ghost{background:var(--card); color:var(--text); box-shadow:inset 0 -4px 0 var(--inset), 0 4px 0 var(--hard);}
  .panel input{
    width:110px; text-align:center; font-size:20px; font-weight:800; font-family:inherit;
    background:var(--card); border:3px solid var(--uiline); border-radius:14px;
    color:var(--text); padding:10px; margin-bottom:16px;
  }
  .panel input:focus{outline:3px solid var(--accent);}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important; transition:none!important;}
  }
</style>
</head>
<body>
<header>
  <button class="lvl-badge" id="lvlBadge" title="Jump to level"><small>LEVEL</small><span id="lvlNum">1</span></button>
  <div class="hud">
    <button id="undoBtn" title="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19.5 12 H5.5"/>
        <path d="M11.5 18 L5.5 12 L11.5 6"/>
      </svg>
    </button>
    <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 13.5 A8.5 8.5 0 1 1 10.5 4 A7 7 0 0 0 20 13.5 Z"/>
      </svg>
    </button>
    <button id="restartBtn" title="Restart level">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.1 8.5 A7 7 0 1 1 12 5"/>
        <path d="M11.2 1.6 L17.4 5 L11.2 8.4 Z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>
</header>
<div id="moves"></div>
  <button id="thumbUndo" title="Undo" aria-label="Undo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.5 12 H5.5"/>
      <path d="M11.5 18 L5.5 12 L11.5 6"/>
    </svg>
  </button>
<div id="board"><div id="boardInner"></div></div>

<div id="deadend">
  <p id="deMsg">NO MOVES LEFT</p>
  <div class="row">
    <button class="btn" id="deUndo">Undo</button>
    <button class="btn ghost" id="deRestart">Restart</button>
    <button class="btn ghost" id="deClose">✕</button>
  </div>
</div>

<div id="overlay">
  <div class="panel win" id="winPanel" style="display:none">
    <h2 class="win-title">LEVEL CLEAR!</h2>
    <div class="win-lvl" id="winLvl"></div>
    <div class="stars" id="starRow"></div>
    <p id="winStats"></p>
    <div class="row win-row">
      <button class="btn-icon" id="winUndo" aria-label="Undo last move" title="Undo last move">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15 L4 10 L9 5"/><path d="M4 10 H14 a5.5 5.5 0 0 1 0 11 H10"/></svg>
      </button>
      <button class="btn-icon" id="replayBtn" aria-label="Replay level" title="Replay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.1 8.5 A7 7 0 1 1 12 5"/>
          <path d="M11.2 1.6 L17.4 5 L11.2 8.4 Z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button class="btn primary" id="nextBtn">Next level
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="arrow">
          <path d="M4 12 L19 12"/><path d="M13 6 L19 12 L13 18"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="panel select" id="jumpPanel" style="display:none">
    <div class="sel-head">
      <h2>Levels</h2>
      <input id="jumpInput" type="text" min="1" max="9999" placeholder="go to…" aria-label="Go to level">
      <button class="btn-icon sel-close" id="jumpCancel" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6 L18 18"/><path d="M18 6 L6 18"/></svg>
      </button>
    </div>
    <div class="sel-nav">
      <button class="btn-icon nav" id="chapPrev" aria-label="Previous chapter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 L8 12 L14.5 19"/></svg>
      </button>
      <div class="chap-label" id="chapLabel"></div>
      <button class="btn-icon nav" id="chapNext" aria-label="Next chapter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5 L16 12 L9.5 19"/></svg>
      </button>
    </div>
    <div class="lvgrid" id="lvGrid"></div>
  </div>
</div>

<script>
(() => {
const COLORS = ['#F7E33D','#6BC93E','#2F7BE0','#E0392C','#FF8C00','#35C4E3','#FF69B4','#FFDEAD','#7B5643','#7A3FC7','#1B5E20','#673147'];
const CAP = 4;
const VERSION = 'v1.0.0';
document.addEventListener('DOMContentLoaded', ()=>{ const v=document.getElementById('ver'); if(v) v.textContent=VERSION; });
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const isMysteryLevel = lv => lv>=8 && lv%2===0;

/* ---------- seeded RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- level generation (reverse-scramble => always solvable) ---------- */
function colorCount(lv){
  if(lv<=2)return 3; if(lv<=5)return 4; if(lv<=9)return 5; if(lv<=14)return 6;
  if(lv<=20)return 7; if(lv<=28)return 8; if(lv<=38)return 9; if(lv<=52)return 10;
  if(lv<=70)return 11; return 12;
}
function genLevel(lv){
  const rnd = mulberry32(lv*7919+13);
  const n = colorCount(lv);
  const t = [];
  for(let c=0;c<n;c++) t.push([c,c,c,c]);
  t.push([],[]);
  const scrambles = Math.min(40 + lv*3, 300);
  const myst = isMysteryLevel(lv);
  let didMoves = 0, guard = 0;
  while(didMoves < scrambles && guard++ < scrambles*20){
    let b;
    if(myst){
      // drain run-topped cups first: shred same-color runs before they can be buried
      const runTops=[];
      for(let i=0;i<t.length;i++){
        const T=t[i];
        if(T.length>=2 && T[T.length-1]===T[T.length-2]) runTops.push(i);
      }
      b = runTops.length ? runTops[Math.floor(rnd()*runTops.length)] : Math.floor(rnd()*t.length);
    } else {
      b = Math.floor(rnd()*t.length);
    }
    const B = t[b];
    if(!B.length) continue;
    let r=1; while(r<B.length && B[B.length-1-r]===B[B.length-1]) r++;
    const opts=[];
    for(let j=1;j<r;j++) opts.push(j);
    if(r===B.length) opts.push(r);
    if(!opts.length) continue;
    // mystery: move single segments to shred same-color runs
    const j = (myst && r>=2) ? 1 : opts[Math.floor(rnd()*opts.length)];
    let targets = t.map((x,i)=>i).filter(i=>i!==b && t[i].length+j<=CAP);
    if(!targets.length) continue;
    if(myst && rnd()>0.04){
      // tier 1: don't rebuild pairs (same-color landing) and don't bury pairs;
      // tier 2: at least don't rebuild; full freedom only via the 4% spice escape
      const c=B[B.length-1];
      const notSame=i=>{const T=t[i]; return !(T.length && T[T.length-1]===c);};
      const noPair=i=>{const T=t[i]; return !(T.length>=2 && T[T.length-1]===T[T.length-2]);};
      const tier1=targets.filter(i=>notSame(i)&&noPair(i));
      const tier2=targets.filter(notSame);
      targets = tier1.length ? tier1 : (tier2.length ? tier2 : targets);
    }
    const a = targets[Math.floor(rnd()*targets.length)];
    for(let k=0;k<j;k++) t[a].push(t[b].pop());
    didMoves++;
  }
  for(let i=0;i<t.length;i++){
    if(t[i].length===CAP && t[i].every(c=>c===t[i][0])){
      const dest = t.findIndex((x,k)=>k!==i && x.length<CAP);
      if(dest>=0) t[dest].push(t[i].pop());
    }
  }
  // 3 rows with at most 5 cups per row once the field passes 10 cups:
  // narrower board = bigger cups on phones and easier thumb reach.
  // cols stays semantic (faucets pour into i+cols), so it is fixed here
  // at generation and used consistently by the solver and renderer.
  const colsFor = n => n > 10 ? Math.min(5, Math.ceil(n/3)) : Math.ceil(n/2);
  const nCols = colsFor(t.length);
  // Mystery levels: reverse-scrambling structurally clumps same-color runs, which
  // makes hidden tiles guessable. Instead, deal segments randomly with a
  // no-same-color-landing rule (near-zero stacked pairs by construction) and
  // keep the first deal the solver verifies as winnable. The biased scramble
  // above remains as the fallback if no deal verifies.
  if(myst){
    for(let attempt=0; attempt<12; attempt++){
      const bag=[];
      for(let c=0;c<n;c++) for(let k=0;k<4;k++) bag.push(c);
      for(let i=bag.length-1;i>0;i--){
        const j2=Math.floor(rnd()*(i+1));
        [bag[i],bag[j2]]=[bag[j2],bag[i]];
      }
      const d=t.map(()=>[]);
      let ok=true;
      for(const c of bag){
        let cands=[];
        for(let i2=0;i2<d.length;i2++){
          if(d[i2].length>=CAP) continue;
          if(d[i2].length && d[i2][d[i2].length-1]===c) continue;
          cands.push(i2);
        }
        if(!cands.length) cands=d.map((x,i2)=>i2).filter(i2=>d[i2].length<CAP);
        if(!cands.length){ ok=false; break; }
        d[cands[Math.floor(rnd()*cands.length)]].push(c);
      }
      if(!ok) continue;
      if(solveState(d, new Set(), new Set(), nCols, 60000)==='win'){
        for(let i2=0;i2<t.length;i2++) t[i2]=d[i2];
        break;
      }
    }
  }
  const f = new Set();
  if(lv>=3 && !isMysteryLevel(lv)){
    const howMany = lv>=12 ? 2 : 1;
    const candidates = [];
    for(let i=0;i<nCols;i++) if(i+nCols < t.length) candidates.push(i);
    for(let k=0;k<howMany && candidates.length;k++){
      const idx = Math.floor(rnd()*candidates.length);
      f.add(candidates[idx]);
      candidates.splice(idx,1);
    }
  }
  // occasionally a faucet cup is sealed from the start: bottom drain is the only way out.
  // the seal only ships if the solver proves the sealed level is still winnable.
  const sl = new Set();
  if(lv>=15 && f.size && rnd()<0.12){
    const cands=[...f].filter(i=>t[i].length>0);
    if(cands.length){
      sl.add(cands[Math.floor(rnd()*cands.length)]);
      if(solveState(t, sl, f, nCols, 60000)!=='win') sl.clear();
    }
  }
  // Faucet levels where the tap is optional teach nothing and reward ignoring
  // the mechanic. For every non-mystery faucet level up to 8 colors, deal over
  // one spare cup (instead of two) and keep the first layout the solver proves
  // is dead by pours alone yet winnable with the faucet(s). If no such layout
  // is found in the attempt budget, the normal two-spare level ships instead.
  if(!isMysteryLevel(lv) && lv>=3 && n<=8){
    const fCount = f.size || 1;
    outer:
    for(let attempt=0; attempt<60; attempt++){
      const d=[];
      for(let i=0;i<n+1;i++) d.push([]);
      const nc=colsFor(d.length);
      const bag=[];
      for(let c=0;c<n;c++) for(let k=0;k<4;k++) bag.push(c);
      for(let i=bag.length-1;i>0;i--){
        const j2=Math.floor(rnd()*(i+1));
        [bag[i],bag[j2]]=[bag[j2],bag[i]];
      }
      let ok=true;
      for(const c of bag){
        const cands=d.map((x,i2)=>i2).filter(i2=>d[i2].length<CAP);
        if(!cands.length){ ok=false; break; }
        d[cands[Math.floor(rnd()*cands.length)]].push(c);
      }
      if(!ok) continue;
      for(const T of d) if(T.length===CAP && T.every(c=>c===T[0])) continue outer;
      const fCands=[];
      for(let i=0;i<nc;i++) if(i+nc<d.length && d[i].length) fCands.push(i);
      if(fCands.length<fCount) continue;
      const fset=new Set();
      while(fset.size<fCount){
        fset.add(fCands[Math.floor(rnd()*fCands.length)]);
      }
      if(solveState(d, new Set(), new Set(), nc, 60000)!=='dead') continue;
      if(solveState(d, new Set(), fset, nc, 90000)!=='win') continue;
      t.length=0; d.forEach(x=>t.push(x));
      f.clear(); fset.forEach(x=>f.add(x));
      sl.clear(); // forced layouts ship without seals
      return {tubes:t, faucets:f, sealed:sl, cols:nc};
    }
  }
  return {tubes:t, faucets:f, sealed:sl, cols:nCols};
}

function isDone(t){ return t.length===CAP && t.every(c=>c===t[0]); }

function isDoneAt(i){ return isDone(tubes[i]) && (!mystery || (hidden[i]||0)===0); }

function tubeEl(i){ return inner.querySelector(`.tube[data-i="${i}"]`); }
/* Display columns are decoupled from logical columns wherever possible.
   Logical cols (faucets pour into i+cols) are fixed at generation and
   binding on faucet levels. Non-faucet levels ignore cols mechanically,
   so the renderer picks whatever arrangement yields the biggest cups for
   the current screen - 2 rows on wide desktops, 3 on phones - and
   re-chooses live on resize. */
const IS_DESKTOP = matchMedia('(hover:hover) and (pointer:fine)').matches;
const UNDO_STRIP = IS_DESKTOP ? 12 : 92;   // desktop reclaims the thumb strip
/* Low-DPI screens rasterize up-scaled boundaries and art with visible AA
   seams, so they never scale above 1 - the rasterization the game shipped
   with and the only one verified seam-free in real use. High-DPI screens
   hide AA and may grow to 1.5x (art is 3x, stays crisp). Below the cap,
   scaling is continuous exact-fit on all devices. */
const MAX_SCALE = ((window.devicePixelRatio || 1) <= 1.5) ? 1 : 1.5;
function snapScale(s){ return Math.min(s, MAX_SCALE); }
function bestDisplayCols(){
  const n = tubes.length;
  if(!n) return cols;
  if(faucets.size) return cols;              // semantic layout: fixed
  const bw = board.clientWidth - 16, bh = board.clientHeight - 8 - UNDO_STRIP;
  const fit = c => {
    const rows = Math.ceil(n/c);
    const nw = c*64 + (c-1)*16, nh = rows*194 + (rows-1)*48;
    return snapScale(Math.min(MAX_SCALE, bw/nw, bh/nh));
  };
  const cands = [...new Set([1,2,3,4].map(r=>Math.ceil(n/r)))].map(c=>({c, s:fit(c)}));
  const top = Math.max(...cands.map(o=>o.s));
  // among near-best arrangements (within 2%), prefer the fewest columns:
  // same cup size, narrower board, easier thumb reach
  return cands.filter(o=>o.s >= top*0.98).sort((a,b)=>a.c-b.c)[0].c;
}
function fitBoard(){
  inner.style.gridTemplateColumns = `repeat(${bestDisplayCols()}, var(--tw))`;
  const bw = board.clientWidth - 16;                 // side breathing room
  const bh = board.clientHeight - 8 - UNDO_STRIP;    // top pad + undo strip
  const nw = inner.scrollWidth, nh = inner.scrollHeight;
  boardScale = snapScale(Math.min(MAX_SCALE, bw/nw, bh/nh));
  inner.style.transform = `translate(-50%, calc(-50% - ${UNDO_STRIP/2 - 4}px)) scale(${boardScale})`;
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', ()=>setTimeout(fitBoard,120));
if(window.visualViewport) window.visualViewport.addEventListener('resize', fitBoard);

/* ---------- game logic ---------- */
function topRun(t){
  if(!t.length) return {color:-1,len:0};
  const c=t[t.length-1]; let l=1;
  while(l<t.length && t[t.length-1-l]===c) l++;
  return {color:c,len:l};
}
function bottomRun(t){
  if(!t.length) return {color:-1,len:0};
  const c=t[0]; let l=1;
  while(l<t.length && t[l]===c) l++;
  return {color:c,len:l};
}
function canPour(a,b){
  if(sealed.has(a) || sealed.has(b)) return 0; // sealed cups: top is closed both ways
  const A=tubes[a], B=tubes[b];
  if(!A.length || B.length>=CAP) return 0;
  const {color,len}=topRun(A);
  if(B.length && B[B.length-1]!==color) return 0;
  const visible = mystery ? A.length - (hidden[a]||0) : len;
  return Math.min(len, visible, CAP-B.length);
}
function canDrain(i){
  const below = i + cols;
  if(below >= tubes.length) return false;
  const A=tubes[i], B=tubes[below];
  if(!A.length || isDone(A)) return false;
  if(sealed.has(below)) return false;
  if(B.length >= CAP) return false;
  const {color}=bottomRun(A);
  if(B.length && B[B.length-1]!==color) return false; // opens only when the layer below matches
  return true;
}
function hasAnyMove(){
  for(let a=0;a<tubes.length;a++){
    if(!tubes[a].length || isDoneAt(a)) continue;
    for(let b=0;b<tubes.length;b++){
      if(a!==b && canPour(a,b)) return true;
    }
  }
  for(const i of faucets){ if(canDrain(i)) return true; }
  return false;
}
/* a sealed cup can never drain again once the cup below it is capped (full forever) */
function sealedStranded(){
  for(const i of sealed){
    if(!tubes[i].length) continue;
    const below = i + cols;
    if(below < tubes.length && isDone(tubes[below])) return true;
  }
  return false;
}
/* budgeted DFS solver: 'win' | 'dead' | 'unknown' (budget exhausted) */
let solveWinLen = 0;
function solveState(startTubes, startSealed, faucetsSet, nCols, budget, rng){
  const doneT = t => t.length===CAP && t.every(c=>c===t[0]);
  const winning = t => t.every(x=>!x.length || doneT(x));
  const key = (t,sl) => t.map((x,i)=>(sl.has(i)?'S':'')+x.join(',')).join('|');
  const seen = new Set();
  let nodes = 0, exhausted = false;
  function rec(t, sl, d){
    if(winning(t)){ solveWinLen = d; return true; }
    if(++nodes > budget){ exhausted = true; return false; }
    const k = key(t,sl);
    if(seen.has(k)) return false;
    seen.add(k);
    const moves=[];
    for(let a=0;a<t.length;a++){
      const A=t[a];
      if(!A.length || doneT(A) || sl.has(a)) continue;
      const c=A[A.length-1]; let run=1;
      while(run<A.length && A[A.length-1-run]===c) run++;
      const singleColor = run===A.length;
      for(let b=0;b<t.length;b++){
        if(a===b || sl.has(b)) continue;
        const B=t[b];
        if(B.length>=CAP) continue;
        if(B.length && B[B.length-1]!==c) continue;
        // moving a whole single-color cup into an empty is a pointless shuffle in plain
        // water sort, but on faucet levels it can be essential (vacating the cup under a tap)
        if(!B.length && singleColor && faucetsSet.size===0) continue;
        const amt=Math.min(run, CAP-B.length);
        const completes = !B.some(x=>x!==c) && B.length+amt===CAP;
        moves.push({type:'p',a,b,amt,score:(completes?0:(B.length?1:3)) + (rng?rng()*0.9:0)});
      }
    }
    for(const i of faucetsSet){
      const below=i+nCols;
      if(below>=t.length) continue;
      const A=t[i], B=t[below];
      if(!A.length || doneT(A)) continue;
      if(sl.has(below)) continue;
      if(B.length>=CAP) continue;
      const c=A[0];
      if(B.length && B[B.length-1]!==c) continue;
      let run=1; while(run<A.length && A[run]===c) run++;
      moves.push({type:'d',a:i,b:below,amt:Math.min(run,CAP-B.length),score:2 + (rng?rng()*0.9:0)});
    }
    moves.sort((x,y)=>x.score-y.score);
    for(const m of moves){
      const nt=t.map(x=>x.slice());
      let nsl=sl;
      if(m.type==='p'){
        for(let k2=0;k2<m.amt;k2++) nt[m.b].push(nt[m.a].pop());
      }else{
        for(let k2=0;k2<m.amt;k2++) nt[m.b].push(nt[m.a].shift());
      }
      if(rec(nt,nsl,d+1)) return true;
      if(exhausted) return false;
    }
    return false;
  }
  const ok = rec(startTubes.map(x=>x.slice()), new Set(startSealed), 0);
  return ok ? 'win' : (exhausted ? 'unknown' : 'dead');
}
function optimalLen(startTubes, faucetsSet, nCols, nodeBudget, upper){
  const doneT = t => t.length===CAP && t.every(c=>c===t[0]);
  const winning = t => t.every(x=>!x.length || doneT(x));
  const hOf = t => {
    let r=0; const cs=new Set();
    for(const x of t) for(let i=0;i<x.length;i++){ cs.add(x[i]); if(i===0||x[i]!==x[i-1]) r++; }
    return r - cs.size;   // each move merges at most one run: admissible
  };
  let nodes=0;
  for(let bound=hOf(startTubes); bound<upper && nodes<nodeBudget; bound++){
    const seen=new Map();
    const dfs=(t,d)=>{
      if(winning(t)) return true;
      if(d+hOf(t)>bound) return false;
      if(++nodes>nodeBudget) return false;
      const k=t.map(x=>x.join(',')).join('|');
      const sd=seen.get(k);
      if(sd!==undefined && sd<=d) return false;
      seen.set(k,d);
      const moves=[];
      for(let a=0;a<t.length;a++){
        const A=t[a];
        if(!A.length || doneT(A)) continue;
        const c=A[A.length-1]; let run=1;
        while(run<A.length && A[A.length-1-run]===c) run++;
        for(let b=0;b<t.length;b++){
          if(a===b) continue;
          const B=t[b];
          if(B.length>=CAP) continue;
          if(B.length && B[B.length-1]!==c) continue;
          if(!B.length && run===A.length) continue;
          const amt=Math.min(run, CAP-B.length);
          const completes = !B.some(x=>x!==c) && B.length+amt===CAP;
          moves.push({type:'p',a,b,amt,score:completes?0:(B.length?1:2)});
        }
      }
      for(const i of faucetsSet){
        const below=i+nCols;
        if(below>=t.length) continue;
        const A=t[i], B=t[below];
        if(!A.length || doneT(A) || B.length>=CAP) continue;
        const c=A[0];
        if(B.length && B[B.length-1]!==c) continue;
        let run=1; while(run<A.length && A[run]===c) run++;
        moves.push({type:'d',a:i,b:below,amt:Math.min(run,CAP-B.length),score:1});
      }
      moves.sort((x,y)=>x.score-y.score);
      for(const m of moves){
        const nt=t.map(x=>x.slice());
        if(m.type==='p'){ for(let k2=0;k2<m.amt;k2++) nt[m.b].push(nt[m.a].pop()); }
        else{ for(let k2=0;k2<m.amt;k2++) nt[m.b].push(nt[m.a].shift()); }
        if(dfs(nt,d+1)) return true;
      }
      return false;
    };
    if(dfs(startTubes.map(x=>x.slice()),0)) return bound;
  }
  return null;
}
let evalToken = 0, deadDismissed = false;
let par = null, parToken = 0, levelStart = null, starsBest = {}, lastWinStars = 3, allUnlocked = false;
let darkMode = false;
function applyTheme(){
  document.body.classList.toggle('dark', darkMode);
  document.documentElement.style.background = darkMode ? '#3C3850' : '#E9E6F2';
  const useDark = darkMode && DARKART.cup;
  ART.cup    = useDark ? DARKART.cup    : SKIN.cup;
  ART.lid    = useDark ? DARKART.lid    : SKIN.lid;
  ART.faucet = useDark ? DARKART.faucet : SKIN.faucet;
  if(typeof tubes!=='undefined' && tubes && tubes.length && typeof render==='function') render();
  const jp=document.getElementById('jumpPanel');
  if(jp && jp.style.display!=='none' && typeof buildSelect==='function') buildSelect();
}
function fallbackPar(){
  // lower-bound-ish estimate: every extra same-color run must be merged by a pour
  if(!levelStart) return Math.max(4, moves||8);
  let runs=0; const colors=new Set();
  for(const t of levelStart){
    for(let i=0;i<t.length;i++){ colors.add(t[i]); if(i===0 || t[i]!==t[i-1]) runs++; }
  }
  return Math.max(3, runs - colors.size + 1);
}
function starsFor(m, p){
  const eff = mystery ? Math.ceil(p*1.25) : p;  // par assumes full information; fog earns slack
  if(m <= Math.ceil(eff*1.1)+1) return 3;       // near the best known line (+10% and one move)
  if(m <= Math.ceil(eff*1.5))   return 2;       // solid: within one-and-a-half times
  return 1;                                     // you still won
}
function showDead(msg){
  if(deadDismissed) return;
  document.getElementById('deMsg').textContent = msg;
  document.getElementById('deadend').classList.add('show');
}
function evaluateState(){
  const de = document.getElementById('deadend');
  const won = tubes.every((t,i)=>!t.length || isDoneAt(i));
  if(won || busy){ de.classList.remove('show'); return; }
  if(!hasAnyMove()){ showDead('NO MOVES LEFT'); return; }
  if(sealedStranded()){ showDead('NO WAY TO WIN'); return; }
  de.classList.remove('show');
  // deeper check: prove unwinnable states that still have legal moves
  const token = ++evalToken;
  const snapT = tubes.map(x=>x.slice()), snapS = new Set(sealed);
  setTimeout(()=>{
    if(token!==evalToken || busy) return;
    const res = solveState(snapT, snapS, faucets, cols, 20000);
    if(token!==evalToken || busy) return;
    if(res==='dead') showDead('NO WAY TO WIN');
  }, 80);
}
function reject(i){
  const el=tubeEl(i);
  el.classList.add('reject');
  setTimeout(()=>el.classList.remove('reject'),320);
}
function tap(i){
  if(busy) return;
  if(selected===-1){
    if(!tubes[i].length || isDoneAt(i) || sealed.has(i)) return;
    selected=i;
    tubeEl(i).classList.add('sel'); // class toggle only: keeps the lift transition smooth
    return;
  }
  if(selected===i){
    tubeEl(i).classList.remove('sel');
    selected=-1;
    return;
  }
  const amt=canPour(selected,i);
  if(!amt){
    const prev=tubeEl(selected);
    if(prev) prev.classList.remove('sel');
    selected=-1;
    reject(i);
    return;
  }
  doPour(selected,i,amt);
}

/* ---------- animation helpers ---------- */
function surfaceY(el, count){
  const r = el.getBoundingClientRect();
  const s = r.height/164;
  return r.bottom - (GEO.pad + count*GEO.seg)*s;
}
function makeStream(sx, sy, ex, ey, color, grow, hold, shrink){
  const total=grow+hold+shrink;
  const pad=14+Math.ceil(Math.max(24, ey-sy)*0.30); // room for the launch arc
  const minX=Math.min(sx,ex)-pad, w=Math.abs(ex-sx)+pad*2, h=Math.max(10, ey-sy)+pad;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','stream');
  svg.setAttribute('width',w); svg.setAttribute('height',h);
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  svg.style.left=minX+'px'; svg.style.top=(sy-4)+'px';
  const lx=sx-minX, ly=4, exl=ex-minX, eyl=ey-sy+4;
  // launch along the tilted rim (≈66° from vertical), land vertically: projectile arc
  const dirn = exl>=lx ? 1 : -1;
  const D = Math.max(24, eyl-ly);
  const TILT = Math.abs(exl-lx)<4 ? 0 : 66*Math.PI/180; // faucet drains fall straight
  // root the stream slightly behind the lip so liquid wraps the rim edge
  const bx = lx - dirn*Math.sin(TILT)*6, by = ly - Math.cos(TILT)*6;
  const c1x = lx + dirn*Math.sin(TILT)*D*0.30, c1y = ly + Math.cos(TILT)*D*0.30;
  const c2x = exl, c2y = eyl - D*0.42;
  const mid_d=`M${bx} ${by} L${lx} ${ly} C${c1x} ${c1y} ${c2x} ${c2y} ${exl} ${eyl}`;
  // taper: start edge perpendicular to the launch direction, narrowing to the landing
  const nx = -Math.cos(TILT)*dirn, ny = Math.sin(TILT);
  const a1x=bx+nx*5.5, a1y=by+ny*5.5, a2x=bx-nx*5.5, a2y=by-ny*5.5;
  const taper=`M${a1x} ${a1y} L${lx+nx*5.5} ${ly+ny*5.5} C${c1x+nx*4.5} ${c1y+ny*4.5} ${c2x-3.8} ${c2y} ${exl-3} ${eyl}`+
              ` L${exl+3} ${eyl} C${c2x+3.8} ${c2y} ${c1x-nx*4.5} ${c1y-ny*4.5} ${lx-nx*5.5} ${ly-ny*5.5} L${a2x} ${a2y} Z`;
  const maskId='sm'+Math.random().toString(36).slice(2,9);
  const defs=document.createElementNS(NS,'defs');
  const mask=document.createElementNS(NS,'mask');
  mask.setAttribute('id',maskId);
  const mpath=document.createElementNS(NS,'path');
  mpath.setAttribute('d',taper); mpath.setAttribute('fill','#FFFFFF');
  mask.appendChild(mpath); defs.appendChild(mask); svg.appendChild(defs);
  const g=document.createElementNS(NS,'g');
  g.setAttribute('mask',`url(#${maskId})`);
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',mid_d); p.setAttribute('fill','none');
  p.setAttribute('stroke',color); p.setAttribute('stroke-width',12);
  p.setAttribute('stroke-linecap','round'); p.setAttribute('pathLength','100');
  p.style.strokeDasharray='100'; p.style.strokeDashoffset='100';
  g.appendChild(p);
  // a bright dash drifting down the stream: liquid in motion
  const glint=document.createElementNS(NS,'path');
  glint.setAttribute('d',mid_d); glint.setAttribute('fill','none');
  glint.setAttribute('stroke','rgba(255,255,255,.34)'); glint.setAttribute('stroke-width',4);
  glint.setAttribute('stroke-linecap','round'); glint.setAttribute('pathLength','100');
  glint.style.strokeDasharray='12 88'; glint.style.strokeDashoffset='0';
  g.appendChild(glint); svg.appendChild(g);
  document.body.appendChild(svg);
  p.animate(
    [{strokeDashoffset:100},
     {strokeDashoffset:0, offset:grow/total},
     {strokeDashoffset:0, offset:(grow+hold)/total},
     {strokeDashoffset:-100}],
    {duration:total, easing:'linear', fill:'forwards'}
  );
  glint.animate([{strokeDashoffset:20},{strokeDashoffset:-180}],
    {duration:total, easing:'linear', fill:'forwards'});
  glint.animate(
    [{opacity:0},{opacity:1, offset:Math.min(.95,(grow+20)/total)},
     {opacity:1, offset:(grow+hold)/total},{opacity:0}],
    {duration:total, easing:'linear', fill:'forwards'});
  setTimeout(()=>svg.remove(), total+80);
}
function makeSplash(dstEl, x, y, color, duration){
  const host=dstEl && dstEl.querySelector('.liquid');
  if(!host) return;
  const hr=host.getBoundingClientRect();
  const lx=(x-hr.left)/boardScale, ly=(y-hr.top)/boardScale;
  const waves=4;
  for(let w=0; w<waves; w++){
    const id=setTimeout(()=>{
      // surface ripple at the impact point
      const rp=document.createElement('div');
      rp.className='ripple';
      rp.style.borderColor=color;
      rp.style.left=lx+'px'; rp.style.top=ly+'px';
      host.appendChild(rp);
      rp.animate(
        [{transform:'translate(-50%,-50%) scale(.3,.18)', opacity:.85},
         {transform:'translate(-50%,-50%) scale(1,.42)', opacity:.4, offset:.6},
         {transform:'translate(-50%,-50%) scale(1.5,.55)', opacity:0}],
        {duration:340, easing:'cubic-bezier(.2,.6,.4,1)'}
      ).onfinish=()=>rp.remove();
      if(w===0){
        // crown: a quick vertical pop right at first impact
        const cr=document.createElement('div');
        cr.className='splash';
        cr.style.width='9px'; cr.style.height='9px';
        cr.style.background=color;
        cr.style.left=lx+'px'; cr.style.top=ly+'px';
        host.appendChild(cr);
        cr.animate(
          [{transform:'translate(-50%,-50%) scale(.7,.5)', opacity:.9},
           {transform:'translate(-50%,-85%) scale(1,1.15)', opacity:.85, offset:.45},
           {transform:'translate(-50%,-100%) scale(.9,.9)', opacity:0}],
          {duration:260, easing:'ease-out'}
        ).onfinish=()=>cr.remove();
      }
      // droplets: stretch out fast, hang at the apex, fall back while fading
      for(let k=0;k<4;k++){
        const d=document.createElement('div');
        d.className='splash';
        const sz=4+Math.random()*4;
        d.style.width=sz+'px'; d.style.height=sz+'px';
        d.style.background=color;
        d.style.left=lx+'px'; d.style.top=ly+'px';
        host.appendChild(d);
        const dx=Math.random()*38-19, up=-(10+Math.random()*15), fall=9+Math.random()*7;
        d.animate(
          [{transform:'translate(-50%,-50%) scale(1.15,.85)', opacity:.95},
           {transform:`translate(calc(-50% + ${dx*.7}px), calc(-50% + ${up}px)) scale(1)`, opacity:.95, offset:.45, easing:'ease-in'},
           {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${up+fall}px)) scale(.55)`, opacity:0}],
          {duration:330+Math.random()*140, easing:'ease-out'}
        ).onfinish=()=>d.remove();
      }
    }, 30 + w*(duration/waves));
    if(pending) pending.timers.push(id);
  }
}
function swish(i, dirn, strength, dur){
  if(REDUCED) return;
  const el=tubeEl(i); if(!el) return;
  const liq=el.querySelector('.liqInner'); if(!liq) return;
  liq.style.transformOrigin='50% 100%';
  liq.style.willChange='transform';
  const a=liq.animate(
    [{transform:'scaleY(1) skewX(0deg)'},
     {transform:`scaleY(${1+.03*strength}) skewX(${(1.1*dirn*strength).toFixed(2)}deg)`, offset:.3},
     {transform:`scaleY(${1-.015*strength}) skewX(${(-.7*dirn*strength).toFixed(2)}deg)`, offset:.65},
     {transform:'scaleY(1) skewX(0deg)'}],
    {duration:dur||260, easing:'ease-out'}
  );
  a.onfinish=()=>{ liq.style.willChange='auto'; };
}
function transferOut(srcEl, amt, fromBottom, pourDir){
  const segs=[...srcEl.querySelectorAll('.seg:not(.drained)')];
  const outgoing=(fromBottom ? segs.slice(0,amt) : segs.slice(-amt));
  const ordered=fromBottom ? outgoing : outgoing.slice().reverse(); // top layer drains first
  ordered.forEach((s,i)=>{
    const delay=fromBottom ? 0 : i*150;
    s.classList.add('drained'); s.classList.remove('topsurf');
    s.style.transitionDelay=delay+'ms';
    s.style.height='0px';
    if(!fromBottom && pourDir){
      // the liquid slides toward the lip as it leaves, not a flat wipe
      const full='polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)';
      const wedge = pourDir>0
        ? 'polygon(100% 0%, 100% 0%, 100% 100%, 35% 100%)'
        : 'polygon(0% 0%, 0% 0%, 65% 100%, 0% 100%)';
      s.animate([{clipPath:full},{clipPath:wedge}],
        {duration:190, delay, easing:'ease-in', fill:'forwards'});
    }
  });
  if(!fromBottom){
    const ex=segs[segs.length-amt-1];
    if(ex) ex.classList.add('topsurf');
  }
}
function transferIn(dstEl, amt, color){
  const dstLiq=dstEl.querySelector('.liquid');
  if(!dstLiq) return; // completed cups render without a liquid layer
  const dstBox=dstEl.querySelector('.liqInner')||dstLiq;
  for(let k=0;k<amt;k++){
    const s=document.createElement('div');
    s.className='seg pour-in'; s.style.background=color;
    dstBox.appendChild(s);
    requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.remove('pour-in')));
  }
  const live=dstLiq.querySelectorAll('.seg:not(.drained)');
  live.forEach(sg=>sg.classList.remove('topsurf'));
  if(live.length) live[live.length-1].classList.add('topsurf');
}
function transferSegs(srcEl, dstEl, amt, color, fromBottom){
  transferOut(srcEl, amt, fromBottom);
  transferIn(dstEl, amt, color);
}
/* spam-click: jump the running move straight to its final frame */
function fastForward(){
  if(!pending) return;
  const p=pending; pending=null;
  p.timers.forEach(clearTimeout);
  p.anims.forEach(a=>{try{a.cancel();}catch(e){}});
  document.querySelectorAll('.stream,.splash').forEach(e=>e.remove());
  inner.querySelectorAll('.pouring').forEach(t=>t.classList.remove('pouring'));
  p.commit();
}

/* ---------- moves ---------- */
function findWinningMove(){
  const cands=[];
  const winningSim=(sim, simHidden)=> sim.every((t,i)=>
    !t.length || (t.length===CAP && t.every(c=>c===t[0]) && (!mystery || (simHidden[i]||0)===0))
  );
  for(let a=0;a<tubes.length;a++){
    for(let b=0;b<tubes.length;b++){
      if(a===b) continue;
      const amt=canPour(a,b);
      if(!amt) continue;
      const sim=tubes.map(t=>t.slice());
      for(let k=0;k<amt;k++) sim[b].push(sim[a].pop());
      const simHidden = hidden.slice();
      if(mystery) simHidden[a]=Math.min(simHidden[a]||0, Math.max(0, sim[a].length-1));
      if(winningSim(sim, simHidden)) cands.push({type:'p',a,b,amt});
    }
  }
  for(const i of faucets){
    if(!canDrain(i)) continue;
    const below=i+cols;
    const {len}=bottomRun(tubes[i]);
    const amt=Math.min(len, CAP-tubes[below].length);
    const sim=tubes.map(t=>t.slice());
    for(let k=0;k<amt;k++) sim[below].push(sim[i].shift());
    if(winningSim(sim, hidden.slice())) cands.push({type:'d',a:i,amt});
  }
  if(!cands.length) return null;
  // preference: faucet finishes first, then the move transferring the least liquid
  cands.sort((x,y)=> ((x.type==='d'?0:1)-(y.type==='d'?0:1)) || (x.amt-y.amt));
  return cands[0];
}
let autoTimer=null;
function afterMove(b){
  deadDismissed=false;
  clearTimeout(autoTimer);
  const wasDone = isDoneAt(b);
  render(); saveProgress();
  if(wasDone) capCelebration(b);
  const won = tubes.every((t,i)=>!t.length || isDoneAt(i));
  checkWin();
  if(!won){
    if(findWinningMove()){
      autoTimer=setTimeout(()=>{
        if(busy) return;
        const mm=findWinningMove(); // re-derive: the board may have changed since scheduling
        if(!mm) return;
        if(mm.type==='d') drain(mm.a);
        else doPour(mm.a, mm.b, mm.amt);
      }, 380);
    }
  }
}

function doPour(a,b,amt){
  clearTimeout(autoTimer);
  busy=true; moveStartAt=performance.now();
  history.push({type:'pour',a,b,amt, hid: mystery ? hidden.slice() : null});
  moves++;
  const color=COLORS[tubes[a][tubes[a].length-1]];
  const src=tubeEl(a), dst=tubeEl(b);
  const wasSel=src.classList.contains('sel');
  src.classList.remove('sel');
  let committed=false;
  const commit=()=>{
    if(committed) return; committed=true; pending=null;
    let revealedTube=-1;
    if(mystery){
      const newLen=tubes[a].length-amt;
      const newHidden=Math.min(hidden[a]||0, Math.max(0, newLen-1));
      if(newHidden < (hidden[a]||0)) revealedTube=a;
    }
    for(let k=0;k<amt;k++) tubes[b].push(tubes[a].pop());
    if(mystery) hidden[a]=Math.min(hidden[a]||0, Math.max(0, tubes[a].length-1));
    selected=-1; busy=false;
    afterMove(b);
    if(revealedTube>=0 && tubes[revealedTube].length) revealPuff(revealedTube);
  };
  pending={timers:[], anims:[], commit};

  if(REDUCED){
    transferSegs(src,dst,amt,color,false);
    pending.timers.push(setTimeout(commit,180));
    return;
  }

  // flight: hang the cup so its pour-lip corner sits over the target rim
  const T_OUT=160, T_HOLD=200, T_BACK=165;
  const r1=src.getBoundingClientRect(), r2=dst.getBoundingClientRect();
  const c1={x:r1.left+r1.width/2, y:r1.top+r1.height/2};
  const dir = c1.x <= r2.left+r2.width/2 ? 1 : -1;
  const ang = 65*Math.PI/180, S = boardScale;
  const lipOff = {
    x: dir*(GEO.lipX*Math.cos(ang) + GEO.lipY*Math.sin(ang))*S,
    y: (GEO.lipX*Math.sin(ang) - GEO.lipY*Math.cos(ang))*S
  };
  const tCx = r2.left+r2.width/2;
  const P = {x:tCx - dir*16*S, y:r2.top - 2*S};
  const T = {x:(P.x-lipOff.x-c1.x)/S, y:(P.y-lipOff.y-c1.y)/S};

  src.classList.add('pouring');
  let flight=null;
  {
    const liqEl=src.querySelector('.liquid');
    if(liqEl && tubes[a].length){
      const n=tubes[a].length;
      const stops=tubes[a].map((c,k)=>{
        const col=(mystery && k<(hidden[a]||0)) ? '#C7C1D9' : COLORS[c];
        return `${col} ${k*GEO.seg}px ${(k+1)*GEO.seg}px`;
      }).join(', ');
      flight=document.createElement('div');
      flight.className='flightliq';
      flight.style.bottom=GEO.pad+'px';
      flight.style.height=(n*GEO.seg)+'px';
      flight.style.backgroundImage=`linear-gradient(to top, ${stops})`;
      flight.style.backgroundSize=`100% ${n*GEO.seg}px`;
      flight.style.backgroundPosition='bottom';
      const topIdx=n-1;
      flight.style.setProperty('--top',
        (mystery && topIdx<(hidden[a]||0)) ? '#C7C1D9' : COLORS[tubes[a][topIdx]]);
      liqEl.appendChild(flight);
      liqEl.classList.add('inflight');
    }
  }
  const poseMid=`translate(${T.x*.55}px,${T.y*.55-16}px) rotate(${dir*24}deg)`;
  const poseA=`translate(${T.x}px,${T.y}px) rotate(${dir*63.5}deg)`;
  const poseB=`translate(${T.x}px,${T.y}px) rotate(${dir*66}deg)`;
  const anim=src.animate(
    [{transform:`translate(0,${wasSel?-16:0}px) rotate(0deg)`},
     {transform:poseMid, offset:.42},
     {transform:poseA}],
    {duration:T_OUT, easing:'cubic-bezier(.45,0,.35,1)', fill:'forwards'}
  );
  pending.anims.push(anim);
  let holdAnim=null;
  anim.onfinish=()=>{
    holdAnim=src.animate([{transform:poseA},{transform:poseB}],
      {duration:T_HOLD, easing:'ease-out', fill:'forwards'});
    if(pending) pending.anims.push(holdAnim);
    const sy = surfaceY(dst, tubes[b].length);
    makeStream(P.x, P.y, tCx, sy, color, 50, T_HOLD-70, 60);
    makeSplash(dst, tCx, sy, color, T_HOLD);
    transferOut(src, amt, false, dir);
    if(flight){
      const nl=tubes[a].length-amt;
      // continuous drop through every departing layer, always animated (even to empty)
      const drainMs=170+(amt-1)*30;
      flight.style.transitionDuration=drainMs+'ms, '+drainMs+'ms, 120ms';
      flight.style.height=(nl*GEO.seg)+'px';
      if(nl>0){
        flight.style.setProperty('--top',
          (mystery && nl-1<(hidden[a]||0)) ? '#C7C1D9' : COLORS[tubes[a][nl-1]]);
      }else{
        // emptied: the surface can't outlive the liquid
        pending.timers.push(setTimeout(()=>{ flight.style.opacity='0'; }, Math.max(0,drainMs-40)));
      }
    }
    transferIn(dst, amt, color);
    swish(b, dir, 1, 260);
    if(!pending) return;
    pending.timers.push(setTimeout(()=>{
      const back=src.animate(
        [{transform:poseB},
         {transform:`translate(${T.x*.4}px,${T.y*.4-10}px) rotate(${dir*18}deg)`, offset:.5},
         {transform:'translate(0,1.5px) rotate(0deg)', offset:.86},
         {transform:'translate(0,0) rotate(0deg)'}],
        {duration:T_BACK, easing:'cubic-bezier(.4,0,.35,1)', fill:'forwards'}
      );
      if(pending) pending.anims.push(back);
      back.onfinish=()=>{
        anim.cancel(); if(holdAnim) holdAnim.cancel(); back.cancel();
        src.classList.remove('pouring');
        commit();
      };
    }, T_HOLD));
  };
}

function drain(i){
  if(busy) return;
  if(!canDrain(i)){ reject(i); return; }
  clearTimeout(autoTimer);
  const below = i + cols;
  const A=tubes[i], B=tubes[below];
  const {color,len}=bottomRun(A);
  const amt=Math.min(len, CAP-B.length);
  busy=true; moveStartAt=performance.now();
  history.push({type:'drain',a:i,b:below,amt, hid: mystery ? hidden.slice() : null});
  moves++; selected=-1;
  inner.querySelectorAll('.sel').forEach(t=>t.classList.remove('sel'));
  const el=tubeEl(i), belowEl=tubeEl(below);
  let committed=false;
  const commit=()=>{
    if(committed) return; committed=true; pending=null;
    for(let k=0;k<amt;k++){ tubes[below].push(tubes[i].shift()); }
    if(sealed.has(i) && tubes[i].length===0){
    }
    busy=false;
    afterMove(below);
  };
  pending={timers:[], anims:[], commit};
  if(REDUCED){
    transferSegs(el,belowEl,amt,COLORS[color],true);
    pending.timers.push(setTimeout(commit,180));
    return;
  }
  const fb=el.querySelector('.faucet');
  fb.classList.add('open'); // grows while pouring; render() after commit resets it instantly
  const fr=fb.getBoundingClientRect();
  const sy=surfaceY(belowEl, B.length);
  const fx=fr.left+fr.width/2;
  makeStream(fx, fr.bottom-6*boardScale, fx, sy, COLORS[color], 50, 160, 60);
  makeSplash(belowEl, fx, sy, COLORS[color], 200);
  pending.timers.push(setTimeout(()=>{ transferSegs(el,belowEl,amt,COLORS[color],true); swish(below, 1, .9, 200); }, 60));
  pending.timers.push(setTimeout(commit, 300));
}

/* the '?' cover fizzes away like carbonation, unveiling the color beneath */
function revealPuff(i){
  if(REDUCED) return;
  const el=tubeEl(i);
  if(!el) return;
  const segs=el.querySelectorAll('.seg');
  const seg=segs[segs.length-1]; // newly revealed layer is the top one
  if(!seg) return;
  // foam cover: white at the fizzing center, mask-toned at the edges, dissolving in place
  const cover=document.createElement('div');
  cover.className='fizz-cover';
  seg.appendChild(cover); // covers the layer AND its dome: one dissolve, one object
  cover.animate(
    [{opacity:1},
     {opacity:.88, offset:.3},
     {opacity:.5, offset:.62},
     {opacity:0}],
    {duration:540, easing:'ease-out', fill:'forwards'}
  ).onfinish=()=>cover.remove();
  // bubbles fizzing inside the tile: swell, wobble up a few px, pop
  for(let k=0;k<18;k++){
    setTimeout(()=>{
      const b=document.createElement('div');
      b.className='bubble';
      const size=3+Math.random()*5;
      b.style.width=b.style.height=size+'px';
      b.style.left=(8+Math.random()*84)+'%';
      b.style.top=(15+Math.random()*75)+'%';
      seg.appendChild(b); // clipped by the cup like the liquid itself
      const rise=-(4+Math.random()*7), wob=Math.random()*6-3;
      b.animate(
        [{transform:'translate(-50%,-50%) scale(.3)', opacity:0},
         {transform:`translate(calc(-50% + ${wob}px), calc(-50% + ${rise*.5}px)) scale(1)`, opacity:.95, offset:.5},
         {transform:`translate(calc(-50% + ${-wob*.4}px), calc(-50% + ${rise}px)) scale(1.12)`, opacity:.9, offset:.82},
         {transform:`translate(calc(-50% + ${-wob*.4}px), calc(-50% + ${rise}px)) scale(1.45)`, opacity:0}],
        {duration:280+Math.random()*200, easing:'ease-out'}
      ).onfinish=()=>b.remove();
    }, Math.random()*260);
  }
  // a few escapee bubbles rising off the tile's surface before popping
  const r=seg.getBoundingClientRect();
  for(let k=0;k<6;k++){
    setTimeout(()=>{
      const b=document.createElement('div');
      b.className='bubble free';
      const size=3+Math.random()*4;
      b.style.width=b.style.height=size+'px';
      b.style.left=(r.left+6+Math.random()*(r.width-12))+'px';
      b.style.top=(r.top+2)+'px';
      document.body.appendChild(b);
      const rise=-(8+Math.random()*10), wob=Math.random()*8-4;
      b.animate(
        [{transform:'translate(-50%,-50%) scale(.4)', opacity:0},
         {transform:`translate(calc(-50% + ${wob}px), calc(-50% + ${rise*.6}px)) scale(1)`, opacity:.9, offset:.55},
         {transform:`translate(calc(-50% + ${wob*.5}px), calc(-50% + ${rise}px)) scale(1.4)`, opacity:0}],
        {duration:340+Math.random()*180, easing:'ease-out'}
      ).onfinish=()=>b.remove();
    }, 60+Math.random()*260);
  }
}
/* lid pop + confetti bursting out of the lid itself when a cup completes */
function capCelebration(i){
  const el=tubeEl(i);
  if(!el) return;
  const lid=el.querySelector('.lid');
  if(lid && !REDUCED){
    lid.animate(
      [{transform:'translateY(-30px) scale(1.06)', opacity:0},
       {transform:'translateY(3px) scale(1)', opacity:1, offset:.6},
       {transform:'translateY(-2px)', offset:.8},
       {transform:'translateY(0)'}],
      {duration:340, easing:'ease-out'}
    );
  }
  if(REDUCED) return;
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top-6;
  confettiBurst(cx, cy, 14);
  for(let k=0;k<6;k++){
    const sp=document.createElement('div');
    sp.className='spark';
    sp.textContent=k%2?'✦':'✧';
    sp.style.color=k%3?'#FFC93A':'#FFFFFF';
    sp.style.left=cx+'px'; sp.style.top=cy+'px';
    document.body.appendChild(sp);
    const a=(k/6)*Math.PI*2 + Math.random()*.5;
    const d=30+Math.random()*22;
    const rot=Math.random()*180-90;
    sp.animate(
      [{transform:'translate(-50%,-50%) scale(.2) rotate(0deg)', opacity:0},
       {transform:`translate(calc(-50% + ${Math.cos(a)*d*.75}px), calc(-50% + ${Math.sin(a)*d*.75}px)) scale(1.15) rotate(${rot*.6}deg)`, opacity:1, offset:.35},
       {transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d+4}px)) scale(.9) rotate(${rot}deg)`, opacity:0}],
      {duration:480+Math.random()*180, easing:'cubic-bezier(.2,.65,.35,1)'}
    ).onfinish=()=>sp.remove();
  }
}
function confettiBurst(x, y, n){
  if(REDUCED) return;
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=COLORS[i%COLORS.length];
    c.style.left=x+'px';
    c.style.top=y+'px';
    document.body.appendChild(c);
    const ang=-Math.PI/2 + (Math.random()-.5)*Math.PI*.95; // mostly upward, out of the lid
    const v=90+Math.random()*160;
    const dx=Math.cos(ang)*v, dy=Math.sin(ang)*v;
    const r1=Math.random()*240-120, r2=r1+Math.random()*240-120, r3=r2+Math.random()*240-120;
    c.animate([
      {transform:'translate(-50%,-50%) rotate(0deg) scaleY(1)', opacity:1},
      {transform:`translate(calc(-50% + ${dx*.55}px), calc(-50% + ${dy*.55}px)) rotate(${r1}deg) scaleY(.35)`, opacity:1, offset:.35, easing:'ease-in'},
      {transform:`translate(calc(-50% + ${dx*.85}px), calc(-50% + ${dy*.85+90}px)) rotate(${r2}deg) scaleY(1)`, opacity:.9, offset:.7},
      {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy+240}px)) rotate(${r3}deg) scaleY(.4)`, opacity:0}
    ],{duration:1000+Math.random()*400, easing:'cubic-bezier(.15,.6,.4,1)'}).onfinish=()=>c.remove();
  }
}

/* ---------- win celebration: fireworks + confetti rain, skippable with a click ---------- */
let celebrating=false, celebTimers=[];
function fireworkRocket(delay){
  const id=setTimeout(()=>{
    if(!celebrating) return;
    const x=(15+Math.random()*70)/100*innerWidth;
    const yBurst=(16+Math.random()*32)/100*innerHeight;
    const col=COLORS[Math.floor(Math.random()*COLORS.length)];
    const dot=document.createElement('div');
    dot.className='fw-dot';
    dot.style.background=col;
    dot.style.left=x+'px'; dot.style.top=innerHeight+'px';
    document.body.appendChild(dot);
    dot.animate(
      [{transform:'translate(-50%,0)'},{transform:`translate(-50%, ${yBurst-innerHeight}px)`}],
      {duration:420, easing:'cubic-bezier(.2,.6,.4,1)', fill:'forwards'}
    ).onfinish=()=>{
      dot.remove();
      if(celebrating) explode(x,yBurst,col);
    };
  }, delay);
  celebTimers.push(id);
}
function explode(x,y,col){
  const flash=document.createElement('div');
  flash.className='fw-flash';
  flash.style.left=x+'px'; flash.style.top=y+'px';
  flash.style.borderColor=col;
  document.body.appendChild(flash);
  flash.animate(
    [{transform:'translate(-50%,-50%) scale(.2)',opacity:1},{transform:'translate(-50%,-50%) scale(1)',opacity:0}],
    {duration:420, easing:'ease-out'}
  ).onfinish=()=>flash.remove();
  const n=18;
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='fw-dot';
    p.style.background = Math.random()<.3 ? '#FFC93A' : col;
    p.style.left=x+'px'; p.style.top=y+'px';
    document.body.appendChild(p);
    const a=(i/n)*Math.PI*2 + Math.random()*.3;
    const d=60+Math.random()*90;
    p.animate(
      [{transform:'translate(-50%,-50%) scale(1.25)', opacity:1},
       {transform:`translate(calc(-50% + ${Math.cos(a)*d*.8}px), calc(-50% + ${Math.sin(a)*d*.8+18}px)) scale(1)`, opacity:1, offset:.5, easing:'ease-in'},
       {transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d+70}px)) scale(.5)`, opacity:0}],
      {duration:750+Math.random()*250, easing:'cubic-bezier(.1,.7,.3,1)'}
    ).onfinish=()=>p.remove();
  }
}
function confettiRain(duration){
  for(let tms=0; tms<duration; tms+=90){
    const id=setTimeout(()=>{
      if(!celebrating) return;
      for(let k=0;k<3;k++){
        const c=document.createElement('div');
        c.className='confetti';
        c.style.background=COLORS[Math.floor(Math.random()*COLORS.length)];
        c.style.left=(Math.random()*innerWidth)+'px';
        c.style.top='-12px';
        document.body.appendChild(c);
        const drift=Math.random()*120-60;
        const rr1=Math.random()*300-150, rr2=rr1+Math.random()*300-150, rr3=rr2+Math.random()*300-150;
        const H=innerHeight;
        c.animate(
          [{transform:'translate(0,0) rotate(0deg) scaleY(1)', opacity:1},
           {transform:`translate(${drift*.4+16}px, ${H*.32}px) rotate(${rr1}deg) scaleY(.4)`, opacity:1, offset:.34},
           {transform:`translate(${drift*.7-14}px, ${H*.64}px) rotate(${rr2}deg) scaleY(1)`, opacity:.95, offset:.66},
           {transform:`translate(${drift}px, ${H*.78+Math.random()*H*.22}px) rotate(${rr3}deg) scaleY(.45)`, opacity:0}],
          {duration:1400+Math.random()*700, easing:'cubic-bezier(.3,.4,.6,1)'}
        ).onfinish=()=>c.remove();
      }
    }, tms);
    celebTimers.push(id);
  }
}
function starSVG(sz, on){
  const fill = on ? '#FFC93A' : '#E9E5F2';
  const stroke = on ? '#33323F' : 'rgba(51,50,63,.35)';
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 40 40">
    <path d="M20 3 L25 14.5 L37.5 15.8 L28.2 24.2 L31 36.5 L20 30 L9 36.5 L11.8 24.2 L2.5 15.8 L15 14.5 Z"
      fill="${fill}" stroke="${stroke}" stroke-width="2.6" stroke-linejoin="round"/>
  </svg>`;
}
function showWin(){
  const r = lastWinStars;
  document.getElementById('winLvl').textContent = 'LEVEL ' + Math.max(1, level-1);
  const row = document.getElementById('starRow');
  row.innerHTML = '';
  [46,60,46].forEach((sz,i)=>{
    const sp = document.createElement('span');
    const on = i < r;
    sp.className = 'star ' + (on ? 'on' : 'off');
    sp.style.animationDelay = (REDUCED ? 0 : 140 + i*160) + 'ms';
    sp.innerHTML = starSVG(sz, on);
    row.appendChild(sp);
  });
  document.getElementById('winStats').textContent = `Solved in ${moves} moves`;
  showPanel('winPanel');
}
function endCelebration(showPanelNow){
  celebTimers.forEach(clearTimeout); celebTimers=[];
  celebrating=false;
  document.querySelectorAll('.fw-dot,.fw-flash').forEach(e=>e.remove());
  if(showPanelNow) showWin();
}
function checkWin(){
  const won = tubes.every((t,i)=>!t.length || isDoneAt(i));
  if(!won) return;
  lastWinStars = starsFor(moves, par || fallbackPar());
  starsBest[level] = Math.max(starsBest[level]||0, lastWinStars);
  level++; saveProgress();
  if(REDUCED){
    setTimeout(showWin, 300);
    return;
  }
  celebrating=true;
  [150,450,750,1050,1350].forEach(d=>fireworkRocket(d));
  confettiRain(1500);
  const id=setTimeout(()=>endCelebration(true), 2000);
  celebTimers.push(id);
}
function undo(){
  if(busy || !history.length) return;
  clearTimeout(autoTimer);
  deadDismissed=false;
  const m=history.pop();
  if(m.type==='pour'){
    for(let k=0;k<m.amt;k++) tubes[m.a].push(tubes[m.b].pop());
  }else{
    for(let k=0;k<m.amt;k++) tubes[m.a].unshift(tubes[m.b].pop());
  }
  if(m.hid) hidden = m.hid.slice(); // the fog closes back over what the move revealed
  moves++; selected=-1; render();
}
function startLevel(lv, save=true){
  clearTimeout(autoTimer);
  if(celebrating) endCelebration(false);
  level=lv;
  const g=genLevel(lv);
  tubes=g.tubes; faucets=g.faucets; sealed=g.sealed; cols=g.cols;
  mystery=isMysteryLevel(lv);
  hidden=tubes.map(t=>mystery ? Math.max(0, t.length-1) : 0);
  history=[]; moves=0; selected=-1; busy=false; pending=null; deadDismissed=false;
  levelStart = tubes.map(t=>t.slice());
  par = null;
  const pt = ++parToken;
  const psT = levelStart, psS = new Set(sealed), psF = new Set(faucets), psC = cols, psLv = lv;
  setTimeout(()=>{  // pass 1: greedy line
    if(pt !== parToken) return;
    if(solveState(psT, psS, psF, psC, 200000)==='win') par = solveWinLen;
    let k=0;
    const restart=()=>{  // passes 2-6: randomized orderings, keep the shortest line
      if(pt !== parToken) return;
      if(k++ < 5){
        const rng = mulberry32(psLv*31337 + k*101);
        if(solveState(psT, psS, psF, psC, 80000, rng)==='win' && (par===null || solveWinLen<par))
          par = solveWinLen;
        setTimeout(restart, 30);
      }else if(psS.size===0 && par!==null){
        setTimeout(()=>{  // final pass: try to prove the true optimum
          if(pt !== parToken) return;
          const opt = optimalLen(psT, psF, psC, 350000, par);
          if(opt!==null && pt===parToken) par = opt;
        }, 30);
      }
    };
    setTimeout(restart, 30);
  }, 60);
  hidePanels(); render();
  if(save) saveProgress();
}

/* ---------- level select ---------- */
const MECH_ICONS = {
  3: '<svg viewBox="0 0 46 44"><g stroke="#33323F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="#D6D9E3"><rect x="19" y="12" width="8" height="10" rx="2"/><line x1="9" y1="9" x2="37" y2="9"/><circle cx="9" cy="9" r="3.6"/><circle cx="37" cy="9" r="3.6"/><circle cx="23" cy="9" r="5.2"/><path d="M15.5 22 h15 l-2.6 12.5 a3 3 0 0 1 -2.9 2.5 h-4 a3 3 0 0 1 -2.9 -2.5 z"/></g></svg>',
  8: '<svg viewBox="0 0 24 24"><text x="12" y="18" font-size="19" font-weight="900" fill="#7A3FC7" text-anchor="middle" font-family="inherit">?</text></svg>',
  15:'<svg viewBox="0 0 70 30"><rect x="4" y="12" width="62" height="14" rx="7" fill="#E3DEF0" stroke="#33323F" stroke-width="5"/><ellipse cx="35" cy="12" rx="30" ry="6.5" fill="#EFEBF8" stroke="#33323F" stroke-width="5"/></svg>'
};
function miniStars(n){
  const onS  = darkMode ? '#26232F' : '#33323F';
  const offF = darkMode ? '#524E68' : '#DDD8E8';
  const offS = darkMode ? 'rgba(230,226,242,.45)' : 'rgba(51,50,63,.3)';
  let h='';
  for(let i=0;i<3;i++){
    const on=i<n;
    h+=`<svg width="12" height="12" viewBox="0 0 40 40"><path d="M20 3 L25 14.5 L37.5 15.8 L28.2 24.2 L31 36.5 L20 30 L9 36.5 L11.8 24.2 L2.5 15.8 L15 14.5 Z" fill="${on?'#FFC93A':offF}" stroke="${on?onS:offS}" stroke-width="3" stroke-linejoin="round"/></svg>`;
  }
  return h;
}
function frontier(){
  if(allUnlocked) return 9999;
  const beaten = Object.keys(starsBest).map(Number);
  return Math.max(level, beaten.length ? Math.max(...beaten)+1 : 1, 1);
}
let selPage = 0;
function buildSelect(){
  const grid=document.getElementById('lvGrid');
  grid.innerHTML='';
  const fr=frontier();
  const maxPage=Math.floor((9999-1)/15);   // every chapter browsable; locked levels show locks
  selPage=Math.max(0, Math.min(selPage, maxPage));
  const start=selPage*15+1, end=start+14;
  document.getElementById('chapLabel').textContent=`LEVELS ${start} – ${end}`;
  document.getElementById('chapPrev').disabled = selPage===0;
  document.getElementById('chapNext').disabled = selPage>=maxPage;
  for(let n=start;n<=end;n++){
    const b=document.createElement('button');
    const locked = n>fr;
    b.className='lv' + (n===level?' cur':'') + (locked?' locked':'');
    b.innerHTML = locked
      ? `${n}<span class="st"><svg width="12" height="12" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="3" fill="currentColor"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10" fill="none" stroke="currentColor" stroke-width="2.6"/></svg></span>`
      : `${n}<span class="st">${miniStars(starsBest[n]||0)}</span>` +
        (MECH_ICONS[n]?`<span class="mech">${MECH_ICONS[n]}</span>`:'');
    if(locked){
      b.setAttribute('aria-disabled','true');
      b.onclick=()=>{
        b.classList.remove('deny'); void b.offsetWidth; b.classList.add('deny');
      };
    }else{
      b.onclick=()=>startLevel(n);
    }
    grid.appendChild(b);
  }
}

/* ---------- panels ---------- */
const overlay=document.getElementById('overlay');
function showPanel(id){
  overlay.classList.add('show');
  document.getElementById('winPanel').style.display = id==='winPanel'?'block':'none';
  document.getElementById('jumpPanel').style.display = id==='jumpPanel'?'block':'none';
  if(id==='jumpPanel'){ selPage=Math.floor((level-1)/15); buildSelect(); document.getElementById('jumpInput').value=''; }
}
function hidePanels(){ overlay.classList.remove('show'); }

/* ---------- persistence ----------
   window.storage exists only inside the Claude artifact viewer. Hosted on a
   normal website, the same data goes to the browser's localStorage instead,
   under the same key and format. */
const store = window.storage || {
  async set(k,v){ localStorage.setItem(k,v); },
  async get(k){ const v=localStorage.getItem(k); return v==null ? null : { value:v }; }
};
async function saveProgress(){
  try{
    await store.set('watersort-level', JSON.stringify({level, stars:starsBest, dark:darkMode, unlocked:allUnlocked}));
  }catch(e){}
}
async function loadProgress(){
  try{
    {
      const r=await store.get('watersort-level');
      if(r && r.value){
        try{
          const d=JSON.parse(r.value);
          if(d && d.level>=1){
            if(d.stars) starsBest=d.stars;
            if(d.unlocked) allUnlocked=true;
            darkMode = !!d.dark;
            applyTheme();
            return d.level;
          }
        }catch(e){
          const lv=parseInt(r.value,10);   // migrate the old plain-number format
          if(lv>=1) return lv;
        }
      }
    }
  }catch(e){}
  return 1;
}

/* ---------- wire up ---------- */
document.getElementById('undoBtn').onclick=undo;
document.getElementById('themeBtn').onclick=()=>{ darkMode=!darkMode; applyTheme(); saveProgress(); };
document.getElementById('thumbUndo').onclick=undo;
document.getElementById('restartBtn').onclick=()=>startLevel(level,false);
document.getElementById('deUndo').onclick=undo;
document.getElementById('deRestart').onclick=()=>startLevel(level,false);
document.getElementById('deClose').onclick=()=>{
  deadDismissed=true;
  document.getElementById('deadend').classList.remove('show');
};
document.getElementById('nextBtn').onclick=()=>startLevel(level);
document.getElementById('replayBtn').onclick=()=>{ level=Math.max(1,level-1); startLevel(level,false); };
document.getElementById('winUndo').onclick=()=>{ level=Math.max(1,level-1); saveProgress(); hidePanels(); undo(); };
document.getElementById('lvlBadge').onclick=()=>showPanel('jumpPanel');
document.getElementById('jumpCancel').onclick=hidePanels;
function chapGo(dir){
  const before=selPage;
  selPage+=dir; buildSelect();
  if(selPage!==before){
    const g=document.getElementById('lvGrid');
    g.classList.remove('slide-l','slide-r'); void g.offsetWidth;
    g.classList.add(dir>0?'slide-l':'slide-r');
  }
}
document.getElementById('chapPrev').onclick=()=>chapGo(-1);
document.getElementById('chapNext').onclick=()=>chapGo(1);
{
  const panel=document.getElementById('jumpPanel');
  let lastWheel=0;
  panel.addEventListener('wheel', e=>{
    e.preventDefault();
    const now=Date.now();
    if(now-lastWheel<350) return;
    const d = Math.abs(e.deltaX)>Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if(Math.abs(d)<8) return;
    lastWheel=now;
    chapGo(d>0?1:-1);
  }, {passive:false});
  const g=document.getElementById('lvGrid');
  let sx=null, sy=null;
  g.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  g.addEventListener('touchend',e=>{
    if(sx===null) return;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    sx=null;
    if(Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)*1.4) chapGo(dx<0?1:-1);
  },{passive:true});
}
document.getElementById('jumpInput').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const raw=(e.target.value||'').trim();
  if(raw.toLowerCase()==='over9000'){
    allUnlocked=true; saveProgress();
    buildSelect();
    document.getElementById('chapLabel').textContent="IT'S OVER 9000!";
    e.target.value='';
    return;
  }
  const v=Math.max(1,Math.min(frontier(),parseInt(raw,10)||0));
  if(v>=1) startLevel(v);
});
overlay.addEventListener('pointerdown',e=>{ if(e.target===overlay && document.getElementById('jumpPanel').style.display==='block') hidePanels(); });

// any tap during an animation (except the one that started it) skips straight to the final frame;
// a tap during the win celebration skips straight to the panel
document.addEventListener('pointerdown', ()=>{
  if(pending && performance.now()-moveStartAt>60){ fastForward(); return; }
  if(celebrating) endCelebration(true);
}, true);

loadProgress().then(lv=>startLevel(lv,false));
})();
</script>
